<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revolt</title>
<style>
/* Un seul univers : nuit de manif, affiche sérigraphiée sur béton.
   La scène du jeu a une taille fixe (1280×720 en paysage, 720×1280 en portrait)
   et est mise à l'échelle pour tenir dans n'importe quel écran, mini-lecteur compris, sans défilement. */
@font-face { font-family: 'Anton'; src: url('assets/fonts/anton.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'Permanent Marker'; src: url('assets/fonts/permanent-marker.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'Special Elite'; src: url('assets/fonts/special-elite.woff2') format('woff2'); font-display: swap; }
:root {
  --red: #e10600;
  --red-deep: #8f0400;
  --black: #121212;
  --yellow: #ffd400;
  --paper: #ece4d3;
  --concrete: #7d7c78;
  --concrete-dark: #2b2a28;
  --display: 'Anton', 'Impact', 'Arial Narrow', sans-serif;
  --type: 'Special Elite', 'Courier New', monospace;
  --marker: 'Permanent Marker', 'Comic Sans MS', cursive;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--black); color: var(--paper); font-family: var(--type);
  -webkit-tap-highlight-color: transparent; user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

/* ---------- La rue : fond, fumée, gyrophares ---------- */
#street {
  position: fixed; inset: 0; z-index: 0; overflow: hidden;
  background: #1a1918 url('assets/bg.jpg') center 35% / cover no-repeat;
}
#street::before {
  content: ''; position: absolute; inset: 0; z-index: 0; transition: background .6s;
  background:
    radial-gradient(ellipse 55% 60% at 50% 55%, rgba(10,10,10,.55), transparent 75%),
    linear-gradient(180deg, rgba(10,10,10,.35) 0%, rgba(10,10,10,.1) 40%, rgba(10,10,10,.6) 100%);
}
body.strike #street::before {
  background:
    radial-gradient(ellipse 55% 60% at 50% 55%, rgba(40,5,0,.55), transparent 75%),
    linear-gradient(180deg, rgba(120,10,0,.45) 0%, rgba(200,40,0,.25) 50%, rgba(60,5,0,.65) 100%);
}
#smoke { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
.gyro {
  position: absolute; z-index: 2; top: -30vmax; width: 70vmax; height: 70vmax; border-radius: 50%;
  mix-blend-mode: screen; opacity: 0; pointer-events: none;
}
.gyro.blue { left: -25vmax; background: radial-gradient(circle, rgba(40,90,255,.55), transparent 62%); animation: gyro 1.1s infinite; }
.gyro.red  { right: -25vmax; background: radial-gradient(circle, rgba(255,20,20,.5), transparent 62%); animation: gyro 1.1s .55s infinite; }
@keyframes gyro { 0%, 100% { opacity: 0; } 12% { opacity: .55; } 30% { opacity: .1; } 42% { opacity: .45; } 60% { opacity: 0; } }
body.strike .gyro.blue, body.strike .gyro.red { animation-duration: .6s; }

/* ---------- La scène (taille fixe, mise à l'échelle) ---------- */
#stage {
  position: fixed; left: 50%; top: 50%; z-index: 1;
  width: 1280px; height: 720px; transform-origin: 50% 50%;
  display: grid; padding: 16px 18px 52px; gap: 14px 20px;
  grid-template-columns: 270px 1fr 250px;
  grid-template-rows: auto auto auto 1fr;
  grid-template-areas:
    "head   center spin"
    "bal    center bet"
    "win    center tools"
    "msg    center tools";
}
#stage.portrait {
  width: 720px; height: 1280px; padding: 22px 18px 56px; gap: 14px;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto auto auto auto 1fr;
  grid-template-areas:
    "head   head"
    "center center"
    "msg    msg"
    "bal    win"
    "spin   bet"
    "tools  tools";
}
header { grid-area: head; display: grid; justify-items: start; gap: 8px; align-content: start; }
#stage.portrait header { justify-items: center; }
.logo {
  font-family: var(--display); font-size: 78px; line-height: .9; font-weight: normal;
  text-transform: uppercase; margin: 0; letter-spacing: .01em;
  background: var(--red); color: var(--paper); padding: 6px 18px 10px;
  transform: rotate(-2deg);
  clip-path: polygon(1% 6%, 12% 0, 40% 5%, 63% 0, 99% 4%, 100% 50%, 98% 96%, 70% 100%, 33% 95%, 4% 100%, 0 55%);
  text-shadow: 3px 3px 0 var(--black);
}
#stage.portrait .logo { font-size: 96px; }
.logo span { color: var(--yellow); }
.tagline { margin: 0; background: var(--paper); color: var(--black); padding: 3px 10px; font-size: 15px; transform: rotate(1.2deg); }

#center { grid-area: center; display: grid; align-content: center; justify-items: center; gap: 22px; position: relative; }
#stage.portrait #center { gap: 18px; }

/* ---------- Bandeau de bonus ---------- */
#fsbar {
  display: flex; visibility: hidden; align-items: stretch; gap: 10px; justify-content: center;
  font-family: var(--display); text-transform: uppercase; height: 58px;
}
body.strike #fsbar { visibility: visible; }
#fsbar > div { padding: 6px 14px; display: grid; justify-items: center; align-content: center; line-height: 1; }
#fsbar small { font-family: var(--type); text-transform: none; font-size: 12px; margin-top: 4px; }
.fs-title { background: var(--red); color: var(--paper); font-size: 26px; }
.fs-left { background: var(--paper); color: var(--black); font-size: 26px; }
.fs-infl { background: var(--yellow); color: var(--black); font-size: 26px; position: relative; }
.fs-infl.bump { animation: bump .5s; }
@keyframes bump { 30% { transform: scale(1.25) rotate(-3deg); } }

/* ---------- La machine ---------- */
#machine {
  position: relative; width: 680px;
  background: var(--concrete-dark); padding: 12px; border: 3px solid var(--black);
  box-shadow: 0 0 0 3px var(--concrete), 0 30px 60px rgba(0,0,0,.6);
}
#stage.portrait #machine { width: 684px; }
#machine::before, #machine::after {
  content: ''; position: absolute; left: -3px; right: -3px; height: 12px;
  background: repeating-linear-gradient(-45deg, var(--yellow) 0 14px, var(--black) 14px 28px);
}
#machine::before { top: -16px; }
#machine::after { bottom: -16px; }
#reels { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.reel { position: relative; aspect-ratio: 1 / 3; overflow: hidden; background: #191817; border: 2px solid var(--black); }
.strip { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
.cell {
  position: relative; display: grid; place-items: center; padding: 6%;
  background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 60%), var(--paper);
  border-bottom: 2px solid #191817;
}
.cell svg { width: 100%; height: 100%; display: block; overflow: visible; }
.cell img { width: 100%; height: 100%; display: block; object-fit: contain; filter: drop-shadow(2px 3px 0 rgba(0,0,0,.35)); }
.strip.blur .cell img, .strip.blur .cell svg { filter: blur(1.5px); }
.cell.k-wild { background: var(--red); }
.cell.k-scatter { background: var(--yellow); }
.cell.k-euro { background: radial-gradient(circle at 50% 45%, #4a3500, #121212 75%); }
.cell.k-crs, .cell.k-poubelle { background: radial-gradient(circle at 50% 30%, #fff6e4, var(--paper) 70%); }
.euro-val {
  position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); z-index: 3;
  font-family: var(--display); font-size: 24px; line-height: 1;
  background: var(--black); color: var(--yellow); padding: 2px 8px 4px; border: 2px solid var(--yellow);
  animation: euroIn .5s cubic-bezier(.3,1.8,.5,1);
}
@keyframes euroIn { from { transform: translateX(-50%) scale(0) rotate(-20deg); } }
.euro-fly {
  position: fixed; z-index: 30; pointer-events: none; font-family: var(--display); font-size: 28px;
  color: var(--yellow); text-shadow: 0 0 10px rgba(255,212,0,.9), 2px 2px 0 #000;
  transition: transform .7s cubic-bezier(.5,0,.3,1), opacity .7s;
}
.cell.hit { animation: hit .9s ease-in-out infinite; z-index: 2; }
.cell.hit::after {
  content: ''; position: absolute; inset: 3px; border: 4px solid var(--red);
  box-shadow: 0 0 0 2px var(--black), inset 0 0 0 2px var(--black);
}
.cell.k-wild.hit::after { border-color: var(--yellow); }
.cell.dim { filter: grayscale(.8) brightness(.45); }
@keyframes hit { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06) rotate(-1.5deg); } }
.mega-banner {
  position: absolute; inset: 0; z-index: 3; display: grid; place-items: center;
  background: repeating-linear-gradient(-45deg, rgba(225,6,0,.22) 0 16px, transparent 16px 32px);
  pointer-events: none; animation: slam .45s cubic-bezier(.3,1.6,.5,1);
}
.mega-banner span {
  font-family: var(--display); text-transform: uppercase; writing-mode: vertical-rl; transform: rotate(180deg);
  font-size: 28px; letter-spacing: .08em; background: var(--black); color: var(--yellow); padding: 10px 4px;
}
@keyframes slam { from { transform: scaleY(1.6); opacity: 0; } to { transform: none; opacity: 1; } }
#lines { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
#lines polyline { fill: none; stroke: var(--red); stroke-width: 5; stroke-linejoin: round; stroke-linecap: round;
  filter: drop-shadow(0 0 2px #000) drop-shadow(0 0 2px #000); }
#stamp {
  position: absolute; left: 50%; top: 50%; z-index: 6; pointer-events: none; white-space: nowrap;
  font-family: var(--display); text-transform: uppercase; font-size: 50px;
  color: var(--paper); background: var(--red); padding: 4px 18px 8px; border: 4px solid var(--black);
  transform: translate(-50%, -50%) rotate(-6deg) scale(0); opacity: 0;
  transition: transform .25s cubic-bezier(.3,1.7,.5,1), opacity .2s;
}
#stamp.show { transform: translate(-50%, -50%) rotate(-6deg) scale(1); opacity: 1; }

/* ---------- Animations ---------- */
#machine.shake { animation: shake .38s; }
@keyframes shake {
  20% { transform: translate(-5px, 2px) rotate(-.5deg); } 40% { transform: translate(5px, -2px) rotate(.5deg); }
  60% { transform: translate(-3px, 1px); } 80% { transform: translate(2px, -1px); }
}
#reels.thump { animation: thump .2s; }
@keyframes thump { 40% { transform: translateY(4px) scaleY(.99); } }
#reels.quake { animation: quake .5s; }
@keyframes quake { 10%, 50%, 90% { transform: translate(-6px, 3px) rotate(-.6deg); } 30%, 70% { transform: translate(6px, -3px) rotate(.6deg); } }
.reel.spinning::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: linear-gradient(180deg, transparent 0 30%, rgba(225,6,0,.28) 45%, rgba(40,90,255,.28) 55%, transparent 70%);
  background-size: 100% 300%; animation: sweep .5s linear infinite;
}
@keyframes sweep { from { background-position: 0 100%; } to { background-position: 0 0; } }
.reel.tease { z-index: 3; animation: tease .35s infinite alternate; }
@keyframes tease {
  from { box-shadow: 0 0 0 3px var(--yellow), 0 0 22px 6px rgba(255,212,0,.7); }
  to   { box-shadow: 0 0 0 3px var(--red), 0 0 36px 12px rgba(225,6,0,.85); }
}
.reel.land .cell { animation: land .3s cubic-bezier(.3,1.6,.5,1); transform-origin: 50% 100%; }
@keyframes land { 0% { transform: scaleY(.84) scaleX(1.06); } 100% { transform: none; } }
.cell.pop { z-index: 2; animation: popsym .55s cubic-bezier(.3,1.8,.5,1); }
@keyframes popsym { 0% { transform: scale(.5); } 55% { transform: scale(1.2) rotate(-5deg); } 100% { transform: none; } }
.spark {
  position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s); z-index: 7;
  background: var(--c); pointer-events: none; animation: spark .65s cubic-bezier(.2,.7,.4,1) forwards;
}
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }
#flash {
  position: fixed; inset: 0; z-index: 15; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse at 50% 45%, transparent 30%, rgba(225,6,0,.45)),
              radial-gradient(ellipse at 0 0, rgba(40,90,255,.4), transparent 50%);
}
#flash.go { animation: flash .55s; }
@keyframes flash { 12% { opacity: 1; } 30% { opacity: .15; } 45% { opacity: .75; } 100% { opacity: 0; } }
#spin.go { animation: press .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes press { 0% { transform: scale(1); } 25% { transform: translateY(5px) scale(.88); } 65% { transform: scale(1.07) rotate(-6deg); } 100% { transform: none; } }
#shout {
  position: absolute; left: 50%; top: 50%; z-index: 8; pointer-events: none; white-space: nowrap;
  font-family: var(--display); text-transform: uppercase; font-size: 60px; line-height: 1;
  background: var(--black); color: var(--yellow); padding: 6px 20px 10px; border: 4px solid var(--yellow);
  opacity: 0; transform: translate(-50%, -50%) rotate(-5deg);
}
#shout.go { animation: shout 1.15s cubic-bezier(.2,.8,.3,1); }
@keyframes shout {
  0%   { opacity: 1; transform: translate(-260%, -50%) rotate(-5deg); }
  22%  { opacity: 1; transform: translate(-50%, -50%) rotate(-5deg) scale(1.08); }
  30%  { transform: translate(-50%, -50%) rotate(-5deg) scale(1); }
  72%  { opacity: 1; transform: translate(-46%, -50%) rotate(-5deg); }
  100% { opacity: 1; transform: translate(170%, -50%) rotate(-5deg); }
}

/* ---------- Message ---------- */
#msg {
  grid-area: msg; align-self: end; font-size: 16px; line-height: 1.35; color: var(--paper);
  background: rgba(18,18,18,.72); border-left: 4px solid var(--red); padding: 10px 12px; min-height: 64px;
}
#stage.portrait #msg { text-align: center; border-left: 0; border-top: 4px solid var(--red); min-height: 0; }
#msg b { color: var(--yellow); font-weight: normal; }

/* ---------- Compteurs et commandes ---------- */
.meter { background: var(--paper); color: var(--black); padding: 8px 12px; display: grid; gap: 3px; align-content: center; }
.meter .lbl { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.meter output { font-family: var(--display); font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
#balBox { grid-area: bal; }
#winBox { grid-area: win; background: var(--yellow); }
#stage.portrait #winBox { text-align: right; }
#spinBox { grid-area: spin; display: grid; place-items: center; }
#betBox { grid-area: bet; }
.bet-row { display: flex; align-items: center; gap: 8px; }
.bet-row button {
  width: 40px; height: 40px; border: 2px solid var(--black); background: var(--black); color: var(--paper);
  font-family: var(--display); font-size: 24px; line-height: 1; padding: 0;
}
.bet-row button:disabled { opacity: .35; cursor: default; }
.bet-row output { flex: 1; text-align: center; }
#spin {
  width: 150px; height: 150px; border-radius: 50%; border: 5px solid var(--black);
  background: radial-gradient(circle at 35% 30%, #ff3b2f, var(--red) 45%, var(--red-deep));
  color: var(--paper); font-family: var(--display); font-size: 32px; text-transform: uppercase; line-height: 1;
  box-shadow: 0 0 0 5px var(--paper), 0 10px 0 5px var(--black);
}
#stage.portrait #spin { width: 130px; height: 130px; font-size: 28px; }
#spin:disabled { filter: grayscale(.6) brightness(.7); cursor: default; }
#spin small { display: block; font-family: var(--type); font-size: 12px; text-transform: none; margin-top: 4px; }
#tools { grid-area: tools; display: grid; gap: 8px; align-content: start; grid-template-columns: 1fr 1fr; }
#stage.portrait #tools { grid-template-columns: 1fr 1fr 1fr; }
.tool {
  border: 2px solid var(--paper); background: rgba(18,18,18,.6); padding: 10px 8px;
  text-transform: uppercase; font-size: 14px; letter-spacing: .04em; line-height: 1.2;
}
.tool.wide { grid-column: 1 / -1; }
.tool[aria-pressed="true"] { background: var(--paper); color: var(--black); }
.tool:disabled { opacity: .4; cursor: default; }
#buy { border-color: var(--yellow); color: var(--yellow); }
#buy:hover:not(:disabled) { background: var(--yellow); color: var(--black); }
#info { font-family: var(--display); font-size: 18px; }

/* ---------- Bandeau défilant ---------- */
#ticker {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; overflow: hidden;
  background: var(--yellow); color: var(--black); border-top: 3px solid var(--black);
  font-family: var(--display); text-transform: uppercase; font-size: 17px; white-space: nowrap;
  height: 34px; display: flex; align-items: center;
}
#ticker .track { display: inline-block; padding-left: 100%; animation: crawl 60s linear infinite; }
#ticker .up { color: var(--red); }
@keyframes crawl { to { transform: translateX(-100%); } }

/* ---------- Écrans (dans la scène) ---------- */
.overlay {
  position: absolute; inset: 0; z-index: 20; display: none; place-items: center; padding: 30px;
  background: rgba(10,10,10,.82);
}
.overlay.show { display: grid; }
.poster {
  position: relative; max-width: 620px; width: 100%; text-align: center;
  background: var(--paper); color: var(--black); padding: 30px 26px 28px;
  clip-path: polygon(0 2%, 8% 0, 45% 3%, 80% 0, 100% 3%, 98% 45%, 100% 97%, 62% 100%, 25% 97%, 2% 100%, 0 55%);
  animation: pop .5s cubic-bezier(.3,1.5,.5,1);
}
@keyframes pop { from { transform: scale(.4) rotate(-8deg); opacity: 0; } }
.poster h2 {
  font-family: var(--display); text-transform: uppercase; font-weight: normal; margin: 0;
  font-size: 92px; line-height: .9; color: var(--red); text-wrap: balance;
}
.poster .big { font-family: var(--display); font-size: 64px; line-height: 1; margin: 12px 0 4px; font-variant-numeric: tabular-nums; }
.poster p { margin: 8px auto; max-width: 44ch; font-size: 17px; }
.poster .cta, .poster .alt { margin-top: 14px; border: 0; padding: 12px 26px; font-family: var(--display); font-size: 24px; text-transform: uppercase; }
.poster .cta { background: var(--black); color: var(--paper); }
.poster .alt { background: transparent; color: var(--black); border: 2px solid var(--black); }
.poster.red { background: var(--red); color: var(--paper); }
.poster.red h2 { color: var(--yellow); }
.poster.red .cta { background: var(--paper); color: var(--black); }
.choices { display: flex; gap: 10px; justify-content: center; margin: 18px 0 6px; }
.choices button { width: 76px; height: 56px; border: 3px solid var(--black); background: transparent; font-family: var(--display); font-size: 26px; color: var(--black); }
.choices button[aria-pressed="true"] { background: var(--black); color: var(--yellow); }

#rules .poster { max-height: 100%; overflow-y: auto; text-align: left; max-width: 900px; clip-path: none; user-select: text; }
#rules h2 { font-size: 54px; }
#rules h3 { font-family: var(--display); font-weight: normal; text-transform: uppercase; font-size: 24px; margin: 20px 0 6px; color: var(--red); }
#rules p, #rules li { font-size: 15px; max-width: none; margin: 4px 0; }
#rules ul { padding-left: 20px; margin: 6px 0; }
#rules table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
#rules th, #rules td { border: 2px solid var(--black); padding: 6px 10px; text-align: left; }
#rules th { background: var(--black); color: var(--paper); font-weight: normal; text-transform: uppercase; font-size: 13px; letter-spacing: .05em; }
.paytable { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pt { display: grid; grid-template-columns: 60px 1fr; gap: 10px; align-items: center; border: 2px solid var(--black); padding: 6px; }
.pt svg, .pt img { width: 60px; height: 60px; object-fit: contain; }
.pt div { font-size: 14px; line-height: 1.4; font-variant-numeric: tabular-nums; }
.pt b { font-family: var(--display); font-weight: normal; text-transform: uppercase; font-size: 16px; display: block; }
.guide { display: grid; grid-template-columns: 170px 1fr; gap: 4px 14px; font-size: 15px; }
.guide dt { font-family: var(--display); text-transform: uppercase; }
.guide dd { margin: 0; }
.disclaimer { font-size: 13px !important; line-height: 1.45; border-top: 2px solid var(--black); padding-top: 10px; margin-top: 18px !important; }
.close { position: sticky; top: 0; float: right; background: var(--black); color: var(--paper); border: 0; padding: 8px 14px; font-family: var(--display); font-size: 18px; text-transform: uppercase; z-index: 2; }
#stage.portrait .paytable { grid-template-columns: 1fr 1fr; }

@media (prefers-reduced-motion: reduce) {
  #machine.shake, #reels.thump, #reels.quake { animation: none; }
}
</style>
</head>
<body>

<!-- ===================== SYMBOLES SPÉCIAUX (provisoires, sprite SVG) ===================== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hazard" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#ffd400"/><rect width="7" height="14" fill="#121212"/>
    </pattern>
    <radialGradient id="gold" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff6c2"/><stop offset=".45" stop-color="#ffd400"/><stop offset="1" stop-color="#b87800"/>
    </radialGradient>
    <radialGradient id="flame" cx="50%" cy="80%" r="70%">
      <stop offset="0" stop-color="#fff3a0"/><stop offset=".35" stop-color="#ffd400"/>
      <stop offset=".7" stop-color="#ff6a00"/><stop offset="1" stop-color="#e10600"/>
    </radialGradient>
  </defs>
  <!-- WILD : le mégaphone -->
  <symbol id="s-wild" viewBox="0 0 100 100">
    <path d="M76 30q9 20 0 40M85 21q14 29 0 58" fill="none" stroke="#ffd400" stroke-width="5" stroke-linecap="round"/>
    <path d="M30 38L68 16v66L30 60z" fill="#ece4d3" stroke="#121212" stroke-width="4" stroke-linejoin="round"/>
    <path d="M36 42l26-15M36 56l26 15" stroke="#e10600" stroke-width="4"/>
    <rect x="62" y="13" width="11" height="72" rx="3" fill="#ffd400" stroke="#121212" stroke-width="4"/>
    <rect x="15" y="37" width="17" height="25" rx="3" fill="#121212"/>
    <path d="M25 60l-5 17h9l5-17z" fill="#121212"/>
    <rect x="8" y="80" width="46" height="16" fill="#121212" transform="rotate(-4 31 88)"/>

<script>
(() => {
'use strict';
const M = window.RueMath;
const KEYS = M.SYMBOLS.map(s => s.key);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

/* ---------------- Paramètres de lancement (comme sur Stake Engine) ----------------
   ?social=true  → vocabulaire Stake.us (play au lieu de bet, etc.)
   ?currency=USD → devise d'affichage (XGC / XSC pour les jetons de Stake.us)                */
const params = new URLSearchParams(location.search);
const SOCIAL = params.get('social') === 'true';
const CURRENCY = (params.get('currency') || (SOCIAL ? 'XGC' : 'USD')).toUpperCase();

// Mots qui changent en mode social (liste des termes interdits sur Stake.us)
const L = SOCIAL ? {
  bet: 'play', Bet: 'Play', bets: 'plays', totalBet: 'total play amount', TotalBet: 'Total play amount',
  pays: 'wins', Pays: 'Wins', pay: 'win', paytable: 'win table', Paytable: 'Win table',
  buyBtn: 'Get General Strike', buyMode: 'General Strike feature', costLbl: 'Played for', costs: 'can be played for',
  bought: 'General Strike instantly triggered.', insufficient: 'Not enough coins. Lower your play amount.',
} : {
  bet: 'bet', Bet: 'Bet', bets: 'bets', totalBet: 'total bet', TotalBet: 'Total bet',
  pays: 'pays', Pays: 'Pays', pay: 'pay', paytable: 'paytable', Paytable: 'Paytable',
  buyBtn: 'Buy General Strike', buyMode: 'Bonus buy', costLbl: 'Cost', costs: 'costs',
  bought: 'General Strike bought. The barricades are going up.', insufficient: 'Insufficient balance. Lower your bet.',
};

// Noms des symboles affichés (anglais, seule langue obligatoire)
const NAMES = { bidon: 'Fuel Can', portefeuille: 'Empty Wallet', ticket: 'Receipt', gilet: 'Yellow Vest', pave: 'Cobblestone',
  fumigene: 'Smoke Flare', poubelle: 'Burning Bin', crs: 'Riot Helmet', wild: 'Megaphone', scatter: 'Barricade', euro: 'Golden Euro' };
const nameOf = sym => NAMES[KEYS[sym]];

// Chiffres déclarés dans les règles (issus des simulations — à recalculer avec le Math SDK de Stake)
const MODES = [
  { id: 'base', label: 'Base game', cost: 1, rtp: '96.2%' },
  { id: 'buy', label: L.buyMode, cost: M.BONUS_BUY_COST, rtp: '96.0%' },
];

const BETS = [0.2, 0.4, 0.6, 0.8, 1, 2, 3, 4, 5, 10, 20, 50, 100];
const state = { balance: 1000, betIdx: 4, busy: false, turbo: false, auto: 0, sound: true };
const DISPLAY_DECIMALS = { JPY: 0, KRW: 0, IDR: 0, VND: 0, CLP: 0 };
function fmt(v) {
  if (CURRENCY === 'XGC' || CURRENCY === 'XSC') return v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + (CURRENCY === 'XGC' ? ' GC' : ' SC');
  const d = DISPLAY_DECIMALS[CURRENCY] ?? 2;
  try { return v.toLocaleString('en-US', { style: 'currency', currency: CURRENCY, minimumFractionDigits: d, maximumFractionDigits: d }); }
  catch (e) { return v.toFixed(2) + ' ' + CURRENCY; }
}
const bet = () => BETS[state.betIdx];
const wait = ms => new Promise(r => setTimeout(r, state.turbo ? ms * 0.45 : ms));

/* ---------------- Mise à l'échelle de la scène ---------------- */
const stage = $('stage');
let scale = 1;
function fit() {
  const portrait = innerWidth / innerHeight < .9;
  stage.classList.toggle('portrait', portrait);
  const W0 = portrait ? 720 : 1280, H0 = portrait ? 1280 : 720;
  scale = Math.min(innerWidth / W0, innerHeight / H0);
  stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  if (reels.length) reels.forEach(layoutStrip);
}
// position d'un élément relative à un autre, en pixels de la scène (avant mise à l'échelle)
function rel(el, parent) {
  const a = el.getBoundingClientRect(), b = parent.getBoundingClientRect();
  return { x: (a.left - b.left) / scale, y: (a.top - b.top) / scale, w: a.width / scale, h: a.height / scale };
}

/* ---------------- Son (voir sound.js) ---------------- */
const S = window.RueSound;
const sfx = (name, v) => { if (state.sound) S.play(name, v); };
const armSound = () => {
  removeEventListener('pointerdown', armSound); removeEventListener('keydown', armSound);
  if (state.sound) S.enable(true);
};
addEventListener('pointerdown', armSound); addEventListener('keydown', armSound);

/* ---------------- Grille ---------------- */
const reelsEl = $('reels');
const reels = [];
for (let r = 0; r < 5; r++) {
  const reel = document.createElement('div'); reel.className = 'reel';
  const strip = document.createElement('div'); strip.className = 'strip';
  reel.appendChild(strip); reelsEl.appendChild(reel);
  reels.push({ reel, strip, syms: [] });
}
const IMG = { bidon: 1, portefeuille: 1, ticket: 1, gilet: 1, pave: 1, poubelle: 1, crs: 1, fumigene: 1 };
Object.keys(IMG).forEach(k => { const i = new Image(); i.src = `assets/symbols/${k}.png`; });
function symArt(sym, label) {
  const k = KEYS[sym];
  return IMG[k]
    ? `<img src="assets/symbols/${k}.png" alt="${label ? nameOf(sym) : ''}" draggable="false">`
    : `<svg viewBox="0 0 100 100" ${label ? `role="img" aria-label="${nameOf(sym)}"` : 'aria-hidden="true"'}><use href="#s-${k}"/></svg>`;
}
const cellHTML = sym => `<div class="cell k-${KEYS[sym]}">${symArt(sym, true)}</div>`;
function cellH() { return reels[0].reel.clientHeight / 3; }
function layoutStrip(R) { const h = cellH(); R.strip.querySelectorAll('.cell').forEach(c => { c.style.height = h + 'px'; }); }
function setReel(r, syms) {
  const R = reels[r]; R.syms = syms.slice();
  R.strip.style.transform = 'translateY(0)'; R.strip.classList.remove('blur');
  R.strip.innerHTML = syms.map(cellHTML).join('');
  layoutStrip(R);
}
function randomSym(strips) { const s = strips[Math.floor(Math.random() * strips.length)]; return s[Math.floor(Math.random() * s.length)]; }
fit(); addEventListener('resize', fit);
M.STRIPS_BASE.forEach((strip, r) => { const p = Math.floor(Math.random() * strip.length); setReel(r, [0, 1, 2].map(i => strip[(p + i) % strip.length])); });

function cellAt(r, row) { return reels[r].strip.children[row]; }
function clearMarks() {
  document.querySelectorAll('.cell.hit, .cell.dim').forEach(c => c.classList.remove('hit', 'dim'));
  $('lines').innerHTML = '';
  document.querySelectorAll('.mega-banner').forEach(b => b.remove());
  $('stamp').classList.remove('show');
}

/* ---- effets ---- */
function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
const SHOUTS = ["We won't back down!", 'Prices up, wages down!', 'Take the streets!', "It's gonna blow!", 'Revolt!', '€112 to fill up?!'];
const MEGA = ["We won't back down!", 'All together!', 'General strike!', 'Prices up, wages down!', 'Revolt!', 'Hear us!'];
function kick(fast) {
  restart($('spin'), 'go');
  sfx('spin');
  if (fast) return;
  restart($('machine'), 'shake');
  restart($('flash'), 'go');
  if (Math.random() < .35) { const s = $('shout'); s.textContent = SHOUTS[Math.floor(Math.random() * SHOUTS.length)]; restart(s, 'go'); }
}
function sparks(r, n, colors) {
  const m = $('machine'), rb = rel(reels[r].reel, m);
  for (let i = 0; i < n; i++) {
    const p = document.createElement('span'); p.className = 'spark';
    p.style.cssText = `--x:${rb.x + Math.random() * rb.w}px;--y:${rb.y + rb.h - 4}px;--s:${3 + Math.random() * 5}px;--c:${colors[i % colors.length]};` +
      `--dx:${(Math.random() - .5) * 90}px;--dy:${-20 - Math.random() * 70}px;--r:${Math.random() * 360}deg`;
    m.appendChild(p); setTimeout(() => p.remove(), 700);
  }
}
let megaThisSpin = false;
function megaphone() {
  if (megaThisSpin) return; megaThisSpin = true;
  const s = $('shout'); s.textContent = MEGA[Math.floor(Math.random() * MEGA.length)]; restart(s, 'go');
  if (!reduceMotion) { restart($('machine'), 'shake'); restart(reelsEl, 'quake'); }
}
function land(r, col, fast) {
  sfx('stop');
  const R = reels[r];
  R.reel.classList.remove('spinning', 'tease');
  if (col.includes(M.WILD)) megaphone();
  if (fast) return;
  restart(R.reel, 'land'); setTimeout(() => R.reel.classList.remove('land'), 320);
  restart(reelsEl, 'thump');
  sparks(r, 7, ['#ffd400', '#ff6a00', '#7d7c78']);
  col.forEach((s, row) => {
    if (s === M.SCATTER || s === M.WILD) {
      cellAt(r, row).classList.add('pop');
      sparks(r, 10, s === M.SCATTER ? ['#ffd400', '#e10600'] : ['#e10600', '#ece4d3']);
      sfx(s === M.SCATTER ? 'scatter' : 'wild');
    }
  });
}
function spinTo(grid, strips) {
  clearMarks();
  megaThisSpin = false;
  const h = cellH(), fast = state.turbo;
  kick(fast || reduceMotion);
  let teaseDelay = 0, scat = 0;
  return Promise.all(grid.map((col, r) => {
    const tease = !fast && scat >= 2;   // 2 barricades posées : les rouleaux suivants font durer le suspense
    scat += col.filter(s => s === M.SCATTER).length;
    if (tease) teaseDelay += 1100;
    const dur = fast ? 260 + r * 90 : 640 + r * 230 + teaseDelay;
    return new Promise(resolve => {
      const R = reels[r];
      const filler = Array.from({ length: 10 + r * 4 + Math.round(teaseDelay / 70) }, () => randomSym(strips));
      const all = [...col, ...filler, ...R.syms];
      R.strip.innerHTML = all.map(cellHTML).join('');
      layoutStrip(R);
      const start = -(all.length - 3) * h;
      R.strip.style.transform = 'translateY(0)';
      R.strip.classList.add('blur');
      if (!fast) R.reel.classList.add('spinning');
      if (tease) setTimeout(() => { R.reel.classList.add('tease'); sfx('tease'); }, dur - 1250);
      const frames = fast
        ? [{ transform: `translateY(${start}px)` }, { transform: 'translateY(0)' }]
        : [
            { transform: `translateY(${start}px)`, easing: 'cubic-bezier(.3,0,.6,1)' },
            { transform: `translateY(${start - h * .3}px)`, offset: Math.min(.2, 130 / dur), easing: 'cubic-bezier(.55,0,.2,1)' },
            { transform: `translateY(${h * .14}px)`, offset: .9, easing: 'ease-out' },
            { transform: 'translateY(0)' },
          ];
      R.strip.animate(frames, { duration: dur }).onfinish = () => { setReel(r, col); land(r, col, fast); resolve(); };
    });
  }));
}
function drawLines(wins) {
  const svg = $('lines'), m = $('machine');
  svg.setAttribute('viewBox', `0 0 ${m.offsetWidth} ${m.offsetHeight}`);
  svg.innerHTML = wins.filter(w => w.line !== undefined).map(w => {
    const pts = M.PAYLINES[w.line].map((row, r) => { const c = rel(cellAt(r, row), m); return `${c.x + c.w / 2},${c.y + c.h / 2}`; }).join(' ');
    return `<polyline points="${pts}"/>`;
  }).join('');
}
async function showWins(wins, scatterCells, amount, label) {
  const hits = new Set();
  wins.forEach(w => w.cells.forEach(([r, row]) => hits.add(r + ':' + row)));
  scatterCells.forEach(([r, row]) => hits.add(r + ':' + row));
  if (!hits.size) return;
  for (let r = 0; r < 5; r++) for (let row = 0; row < 3; row++) cellAt(r, row).classList.add(hits.has(r + ':' + row) ? 'hit' : 'dim');
  drawLines(wins);
  if (amount > 0) {
    const st = $('stamp'); st.textContent = (label ? label + ' ' : '+') + fmt(amount); st.classList.add('show');
    sfx('win', amount / bet());
  }
  await wait(1300);
}
function describeWins(wins) {
  if (!wins.length) return '';
  const best = wins.slice().sort((a, b) => b.pay - a.pay)[0];
  return `${best.count} × ${nameOf(best.sym)}` + (wins.length > 1 ? ` + ${wins.length - 1} more line${wins.length > 2 ? 's' : ''}` : '');
}
function flyToMeter(fromEl, text) {
  const a = fromEl.getBoundingClientRect(), b = $('fsInflBox').getBoundingClientRect();
  const f = document.createElement('div'); f.className = 'euro-fly'; f.textContent = text;
  f.style.left = (a.left + a.width / 2 - 16) + 'px'; f.style.top = (a.top + a.height / 2 - 16) + 'px';
  document.body.appendChild(f);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    f.style.transform = `translate(${b.left + b.width / 2 - a.left - a.width / 2}px, ${b.top + b.height / 2 - a.top - a.height / 2}px) scale(1.4)`;
    f.style.opacity = '.2';
  }));
  setTimeout(() => f.remove(), 800);
}
function showBanner(r) {
  const b = document.createElement('div'); b.className = 'mega-banner';
  b.innerHTML = '<span>Megaphone</span>';
  reels[r].reel.appendChild(b);
}

/* ---------------- Écrans ---------------- */
function overlay(id, setup) {
  return new Promise(res => {
    const el = $(id); setup && setup(); el.classList.add('show');
    const btn = el.querySelector('.cta');
    const done = () => { el.classList.remove('show'); btn.removeEventListener('click', done); clearTimeout(t); res(); };
    btn.addEventListener('click', done); btn.focus({ preventScroll: true });
    const t = state.auto ? setTimeout(done, 2600) : null;
  });
}
function countUp(el, to, ms) {
  return new Promise(res => {
    const t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / ms); el.textContent = fmt(to * (1 - Math.pow(1 - k, 3))); k < 1 ? requestAnimationFrame(step) : res(); };
    requestAnimationFrame(step);
  });
}
async function bigWin(x, amount) {
  let title = null, sub = '';
  if (x >= 100) { title = 'May 68!'; sub = 'Beneath the cobblestones, the beach.'; }
  else if (x >= 30) { title = 'Riot!'; sub = 'The street has spoken.'; }
  else if (x >= 10) { title = 'Heating up!'; sub = 'The bins are on fire.'; }
  if (!title) return;
  sfx('bigwin', x);
  await overlay('bigwin', () => { $('bwTitle').textContent = title; $('bwSub').textContent = sub; $('bwAmount').textContent = fmt(0); countUp($('bwAmount'), amount, 1400); });
}

/* ---------------- Interface ---------------- */
function render() {
  $('balance').textContent = fmt(state.balance);
  $('bet').textContent = fmt(bet());
  $('buy').textContent = `${L.buyBtn} · ${fmt(bet() * M.BONUS_BUY_COST)}`;
  const lock = state.busy;
  $('spin').disabled = lock;
  $('buy').disabled = lock || state.balance < bet() * M.BONUS_BUY_COST;
  $('betDown').disabled = lock || state.betIdx === 0;
  $('betUp').disabled = lock || state.betIdx === BETS.length - 1;
}
function msg(html) { $('msg').innerHTML = html; }

async function play(mode) {
  if (state.busy) return;
  const cost = mode === 'buy' ? bet() * M.BONUS_BUY_COST : bet();
  if (state.balance < cost) { msg(L.insufficient); state.auto = 0; syncAuto(); return; }
  state.busy = true; state.balance -= cost; $('win').textContent = fmt(0); render();
  msg(mode === 'buy' ? `<b>${L.bought}</b>` : 'The reels are rolling…');

  const round = M.playRound(mode);
  const b = bet();
  await spinTo(round.base.grid, M.STRIPS_BASE);
  const baseAmt = round.base.win * b;
  if (round.base.win > 0) {
    msg(round.base.scatters >= 3 ? `<b>${round.base.scatters} barricades!</b> ` + describeWins(round.base.wins) : describeWins(round.base.wins));
    await showWins(round.base.wins, round.base.scatters >= 3 ? round.base.scatterCells : [], baseAmt);
  } else {
    sfx('lose');
    msg(['Nothing. Just like your payslip.', 'Fuel prices moved again. The reels did not.', "Nothing this time. We won't back down.", 'The street is quiet. For now.'][Math.floor(Math.random() * 4)]);
  }
  let shown = baseAmt;
  $('win').textContent = fmt(shown);

  if (round.bonus) {
    const B = round.bonus;
    sfx('bonus');
    await overlay('bonusScreen', () => {
      $('bsTitle').textContent = 'General Strike';
      $('bsBig').textContent = `${B.spinsAwarded} free spins`;
      $('bsText').textContent = 'The whole country stops. Megaphones take over their reel, Golden Euros pump up the multiplier, and it never goes down.';
      $('bsGo').textContent = 'Take to the streets';
    });
    document.body.classList.add('strike'); smokeBoost = 1;
    let bonusTotal = 0;
    $('fsInfl').textContent = '×1'; $('fsWin').textContent = fmt(0);
    for (const s of B.spins) {
      $('fsLeft').textContent = s.left + 1;
      await spinTo(s.raw, M.STRIPS_FREE);
      $('fsLeft').textContent = s.left;
      if (s.euros.length) {
        for (const [r, row, v] of s.euros) {
          const c = cellAt(r, row), tag = document.createElement('b');
          tag.className = 'euro-val'; tag.textContent = '+' + v; c.appendChild(tag); c.classList.add('pop');
          sfx('euro'); sparks(r, 12, ['#ffd400', '#fff6c2', '#b87800']);
          flyToMeter(c, '+' + v);
          await wait(420);
        }
        $('fsInfl').textContent = '×' + s.mult;
        restart($('fsInflBox'), 'bump');
        msg(`<b>Golden Euro!</b> Multiplier up to ×${s.mult}.`);
        await wait(450);
      }
      if (s.expanded.length) {
        await wait(200);
        for (const r of s.expanded) { setReel(r, [M.WILD, M.WILD, M.WILD]); showBanner(r); sfx('barricade'); await wait(260); }
        msg('<b>Megaphone!</b> It takes over the whole reel.');
        await wait(500);
      }
      if (s.win > 0) {
        msg(describeWins(s.wins) + (s.mult > 1 ? ` · <b>×${s.mult}</b>` : ''));
        await showWins(s.wins, [], s.win * b, s.mult > 1 ? '×' + s.mult : '');
        bonusTotal += s.win * b; shown += s.win * b;
        $('fsWin').textContent = fmt(bonusTotal); $('win').textContent = fmt(Math.min(shown, M.MAX_WIN * b));
        $('fsInfl').textContent = '×' + s.nextMult;
        restart($('fsInflBox'), 'bump');
        sfx('inflation');
      } else {
        msg(`Empty spin. The multiplier holds at <b>×${s.mult}</b>.`);
        await wait(350);
      }
      if (s.retrigger) {
        sfx('retrigger'); msg(`<b>+${s.retrigger} spins!</b> More barricades go up.`);
        await showWins([], s.scatterCells, 0); await wait(300);
      }
    }
    clearMarks();
    sfx('bonusEnd');
    await overlay('bonusScreen', () => {
      $('bsTitle').textContent = 'Strike over';
      $('bsBig').textContent = fmt(round.totalWin * b - baseAmt);
      $('bsText').textContent = round.capped ? `Max win reached: ${M.MAX_WIN.toLocaleString('en-US')}× the ${L.totalBet}.` : `Final multiplier: ×${B.spins[B.spins.length - 1].nextMult}.`;
      $('bsGo').textContent = 'Go home';
    });
    document.body.classList.remove('strike'); smokeBoost = 0;
  }

  const total = round.totalWin * b;
  state.balance += total;
  $('win').textContent = fmt(total);
  await bigWin(round.totalWin * b / cost * (mode === 'buy' ? M.BONUS_BUY_COST : 1), total);
  if (total > 0) msg(`Total win: <b>${fmt(total)}</b>`);
  state.busy = false; render();

  if (state.auto > 0) {
    state.auto--; syncAuto();
    if (state.auto > 0) { await wait(400); play('base'); }
  }
}

/* ---------------- Autoplay : toujours confirmé explicitement ---------------- */
let autoChoice = 10;
function syncAuto() {
  $('auto').setAttribute('aria-pressed', state.auto > 0 ? 'true' : 'false');
  $('auto').textContent = state.auto > 0 ? `Stop (${state.auto})` : 'Autoplay';
}
$('auto').addEventListener('click', () => {
  if (state.auto > 0) { state.auto = 0; syncAuto(); return; }
  $('autoText').textContent = `Spins will be played automatically at ${fmt(bet())} each. You can stop at any time with the Stop button.`;
  $('autoScreen').classList.add('show'); $('autoStart').focus();
});
$('autoChoices').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  autoChoice = +btn.dataset.n;
  $('autoChoices').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === btn));
});
$('autoCancel').addEventListener('click', () => $('autoScreen').classList.remove('show'));
$('autoStart').addEventListener('click', () => {
  $('autoScreen').classList.remove('show');
  state.auto = autoChoice; syncAuto(); if (!state.busy) play('base');
});

$('spin').addEventListener('click', () => play('base'));
$('buy').addEventListener('click', () => play('buy'));
$('betUp').addEventListener('click', () => { state.betIdx = Math.min(BETS.length - 1, state.betIdx + 1); render(); });
$('betDown').addEventListener('click', () => { state.betIdx = Math.max(0, state.betIdx - 1); render(); });
$('turbo').addEventListener('click', e => { state.turbo = !state.turbo; e.currentTarget.setAttribute('aria-pressed', state.turbo); });
$('sound').addEventListener('click', e => {
  state.sound = !state.sound;
  e.currentTarget.setAttribute('aria-pressed', state.sound);
  e.currentTarget.textContent = state.sound ? 'Sound: on' : 'Sound: off';
  S.enable(state.sound);
});
$('info').addEventListener('click', () => { buildRules(); $('rules').classList.add('show'); $('rulesClose').focus(); });
$('rulesClose').addEventListener('click', () => $('rules').classList.remove('show'));
document.addEventListener('keydown', e => {
  // La barre d'espace lance un tour (exigence Stake), sauf si un écran est ouvert
  if (e.code === 'Space' && !document.querySelector('.overlay.show')) { e.preventDefault(); play('base'); }
  if (e.key === 'Escape') { $('rules').classList.remove('show'); $('autoScreen').classList.remove('show'); }
});

/* ---------------- Règles et informations ---------------- */
function buildRules() {
  const b = bet(), lb = b / M.LINES, x = n => n.toLocaleString('en-US') + '×';
  const sym = i => `<div class="pt">${symArt(i, false)}<div><b>${nameOf(i)}${i === M.WILD ? ' (wild)' : ''}</b>5: ${fmt(M.SYMBOLS[i].pays[5] * lb)}<br>4: ${fmt(M.SYMBOLS[i].pays[4] * lb)}<br>3: ${fmt(M.SYMBOLS[i].pays[3] * lb)}</div></div>`;
  const euroVals = M.EURO_VALUES.map(([v]) => '+' + v).join(', ');
  $('rulesBody').innerHTML = `
  <h3>Game modes</h3>
  <table>
    <tr><th>Mode</th><th>${L.costLbl}</th><th>RTP</th><th>Max win</th></tr>
    ${MODES.map(m => `<tr><td>${m.label}</td><td>${x(m.cost)} ${L.totalBet} (${fmt(m.cost * b)})</td><td>${m.rtp}</td><td>${x(M.MAX_WIN)} ${L.totalBet} (${fmt(M.MAX_WIN * b)})</td></tr>`).join('')}
  </table>
  <p>The RTP (return to player) is the theoretical average return, calculated over a very large number of rounds. The max win is ${x(M.MAX_WIN)} the ${L.totalBet} in every mode. When it is reached, the round ends immediately and the max win is awarded.</p>

  <h3>How to play</h3>
  <ul>
    <li>Revolt is played on 5 reels and 3 rows with 20 fixed paylines.</li>
    <li>Wins ${L.pay} from left to right, starting on the leftmost reel, on adjacent reels.</li>
    <li>Only the highest win per payline is ${SOCIAL ? 'awarded' : 'paid'}. Wins on different paylines are added together.</li>
    <li>Barricade wins are added to payline wins.</li>
    <li>All values shown in this ${L.paytable} are for the current ${L.bet} of ${fmt(b)}.</li>
  </ul>

  <h3>${L.Paytable}</h3>
  <div class="paytable">${[M.WILD, 7, 6, 5, 4, 3, 2, 1, 0].map(sym).join('')}</div>

  <h3>Special symbols</h3>
  <div class="paytable">
    <div class="pt">${symArt(M.WILD, false)}<div><b>Megaphone (wild)</b>Lands on reels 2, 3 and 4. Substitutes for all symbols except the Barricade and the Golden Euro. When it lands, it fires a slogan and shakes the reels.</div></div>
    <div class="pt">${symArt(M.SCATTER, false)}<div><b>Barricade (scatter)</b>${L.Pays} anywhere: 3 = ${x(M.SCATTER_PAY[3])}, 4 = ${x(M.SCATTER_PAY[4] || 0)}, 5 = ${x(M.SCATTER_PAY[5])} the ${L.totalBet}. 3, 4 or 5 trigger the General Strike.</div></div>
    <div class="pt">${symArt(M.EURO, false)}<div><b>Golden Euro</b>Only lands during the General Strike. Shows a value of ${euroVals} that is added to the multiplier.</div></div>
  </div>

  <h3>General Strike (free spins)</h3>
  <ul>
    <li>3, 4 or 5 Barricades award ${M.SCATTER_SPINS[3]}, ${M.SCATTER_SPINS[4]} or ${M.SCATTER_SPINS[5]} free spins, played at the ${L.bet} that triggered them.</li>
    <li>Every Megaphone that lands expands to cover its whole reel.</li>
    <li>The multiplier starts at ×1. Each Golden Euro adds its value to the multiplier before the wins of that spin are counted.</li>
    <li>The multiplier also goes up by 1 after every winning free spin. It never resets during the feature.</li>
    <li>3 or more Barricades during the feature award ${M.RETRIGGER_SPINS} more free spins.</li>
  </ul>

  <h3>${L.buyMode}</h3>
  <ul><li>The General Strike ${L.costs} ${x(M.BONUS_BUY_COST)} the ${L.totalBet} (${fmt(M.BONUS_BUY_COST * b)}). It starts with at least 3 Barricades.</li></ul>

  <h3>Buttons</h3>
  <dl class="guide">
    <dt>Spin</dt><dd>Plays one round at the current ${L.bet}. The space bar does the same.</dd>
    <dt>− / +</dt><dd>Lowers or raises the ${L.bet}.</dd>
    <dt>${L.buyBtn}</dt><dd>Starts the General Strike straight away for ${x(M.BONUS_BUY_COST)} the ${L.bet}.</dd>
    <dt>Autoplay</dt><dd>Plays a chosen number of rounds after you confirm. Press Stop at any time.</dd>
    <dt>Turbo</dt><dd>Speeds up the reels and animations.</dd>
    <dt>Sound</dt><dd>Turns all sound and music on or off.</dd>
    <dt>i · Rules</dt><dd>Opens this page.</dd>
    <dt>Balance / Win</dt><dd>Your current balance, and the win of the current round.</dd>
  </dl>

  <p class="disclaimer">Malfunction voids all wins and plays. A consistent internet connection is required. In the event of a disconnection, reload the game to complete any unfinished round. The expected return is calculated over many plays. The game display is not representative of any physical device and is for illustrative purposes only. Winnings are settled according to the amount received from the Remote Game Server and not from events within the web browser. TM and © 2026 Revolt. All rights reserved.</p>`;
}

/* ---------------- Bandeau d'infos ---------------- */
const ticks = [
  'Diesel: €2.09 a litre <span class="up">▲</span>', 'Groceries: +23% in two years <span class="up">▲</span>',
  'Average rent <span class="up">▲</span>', 'Wages <span>■</span> frozen', 'Rally at Place de la République, 6 pm',
  'Electricity bill <span class="up">▲</span>', 'Beneath the cobblestones, the beach', 'Bins burning on Rue de la Roquette',
  'Baguette at €1.40 <span class="up">▲</span>', 'What goes up: everything. What goes down: morale',
];
$('tickerTrack').innerHTML = (ticks.join(' &nbsp;✦&nbsp; ') + ' &nbsp;✦&nbsp; ').repeat(2);

/* ---------------- Fumée et braises du décor ---------------- */
let smokeBoost = 0;
const cv = $('smoke'), cx = cv.getContext('2d');
let W = 0, H = 0; const puffs = [], embers = [];
function size() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
size(); addEventListener('resize', size);
for (let i = 0; i < 70; i++) embers.push({ x: Math.random() * W, y: Math.random() * H, v: .4 + Math.random() * 1.4, s: 1 + Math.random() * 2.2, p: Math.random() * 6 });
// Coordonnées en pixels de l'image de fond (1375 × 768), recalées comme le « cover » du CSS.
const IMG_W = 1375, IMG_H = 768;
const EMITTERS = [
  { x: 275, y: 465, rate: .35, vx: -.18, size: 16 },
  { x: 385, y: 185, rate: .15, vx: -.12, size: 11 },
  { x: 640, y: 300, rate: .3, vx: -.3, size: 18 },
  { x: 695, y: 110, rate: .22, vx: -.25, size: 13 },
  { x: 1010, y: 540, rate: .35, vx: .12, size: 18 },
];
const FIRES = [[275, 470, 70], [1010, 560, 90], [690, 120, 40], [640, 320, 45], [385, 190, 30]];
function mapBg(x, y) { const s = Math.max(W / IMG_W, H / IMG_H); return [(W - IMG_W * s) / 2 + x * s, (H - IMG_H * s) * .35 + y * s, s]; }
function puffSprite(rgb, seed) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  let s = seed; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 26; i++) {
    const ang = rnd() * 6.28, dist = rnd() * 34;
    const x = 64 + Math.cos(ang) * dist, y = 64 + Math.sin(ang) * dist * .7, r = 8 + rnd() * 20;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${rgb},.16)`); gr.addColorStop(.6, `rgba(${rgb},.06)`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  return c;
}
const SPRITES = [puffSprite('40,38,38', 7), puffSprite('58,55,53', 21), puffSprite('85,70,60', 33)];
let lastT = 0;
function frame(t) {
  cx.clearRect(0, 0, W, H);
  const dt = Math.min(50, t - (lastT || t)) / 16.7; lastT = t;
  cx.globalCompositeOperation = 'lighter';
  for (const [fx, fy, fr] of FIRES) {
    const [x, y, s] = mapBg(fx, fy), r = fr * s * (1 + .15 * Math.sin(t / 90 + fx));
    const a = .13 + .07 * Math.sin(t / 70 + fy) + .05 * Math.sin(t / 37 + fx) + (smokeBoost ? .08 : 0);
    const g = cx.createRadialGradient(x, y, 0, x, y, r * 2.2);
    g.addColorStop(0, `rgba(255,150,40,${a})`); g.addColorStop(1, 'rgba(255,80,0,0)');
    cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r * 2.2, 0, Math.PI * 2); cx.fill();
  }
  cx.globalCompositeOperation = 'source-over';
  for (const e of EMITTERS) {
    if (Math.random() < e.rate * dt * (smokeBoost ? 1.3 : 1)) {
      puffs.push({ e, ox: (Math.random() - .5) * 6, oy: 0, vx: e.vx + (Math.random() - .5) * .12, vy: -(.35 + Math.random() * .3),
        age: 0, life: 300 + Math.random() * 220, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .006,
        spr: Math.floor(Math.random() * SPRITES.length) });
    }
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i];
    p.age += dt; p.ox += (p.vx + Math.sin((t / 1800) + p.rot) * .12) * dt; p.oy += p.vy * dt; p.vy *= .999; p.rot += p.vr * dt;
    if (p.age > p.life) { puffs.splice(i, 1); continue; }
    const k = p.age / p.life;
    const [x, y, s] = mapBg(p.e.x, p.e.y);
    const sz = p.e.size * s * (1 + k * 4.5);
    cx.save(); cx.globalAlpha = Math.min(1, p.age / 40) * Math.pow(1 - k, 1.5) * .35;
    cx.translate(x + p.ox * s, y + p.oy * s); cx.rotate(p.rot);
    cx.drawImage(SPRITES[p.spr], -sz, -sz, sz * 2, sz * 2); cx.restore();
  }
  const n = smokeBoost ? embers.length : 30;
  for (let i = 0; i < n; i++) {
    const e = embers[i];
    e.y -= e.v * (smokeBoost ? 1.8 : 1); e.x += Math.sin(t / 700 + e.p) * .6;
    if (e.y < -10) { e.y = H + 10; e.x = Math.random() * W; }
    const flick = .5 + .5 * Math.sin(t / 120 + e.p * 5);
    cx.fillStyle = `rgba(255,${120 + flick * 100 | 0},0,${.5 + flick * .5})`;
    cx.fillRect(e.x, e.y, e.s, e.s);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

$('betLbl').textContent = L.Bet;
$('win').textContent = fmt(0);
msg(`Welcome to the street. <b>20 lines</b>, demo balance, nothing else to lose.`);
render();
})();
</script>
